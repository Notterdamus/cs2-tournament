<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Турнир ICA по CS2</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#0f1420; --panel:#141b28; --panel2:#1b2434;
    --line:#26324a; --line-soft:#1e2740;
    --txt:#e7edf7; --muted:#8a97ad; --dim:#5f6b82;
    --accent:#ff6a1a; --accent-soft:#ffb083;
    --win:#3fbf6b; --loss:#e5484d; --draw:#c9a227;
    --gold:#ffcb47; --silver:#c7d0dd; --bronze:#d98a4b; --blue:#3d7dff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #16223a 0, transparent 60%) var(--bg);
    background-color:var(--bg);
    color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-soft);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 16px 72px}

  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:16px;min-width:0}
  .brand .logo{height:46px;width:auto;flex:none;display:block}
  .brand .titles{min-width:0}
  header.top h1{font-size:clamp(19px,4.6vw,26px);margin:0;letter-spacing:.2px;line-height:1.15}
  header.top .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .updated{color:var(--dim);font-size:12.5px;margin-left:auto;text-align:right}

  .champ{
    display:flex;flex-wrap:wrap;gap:12px;margin:0 0 24px;
  }
  .champ .card{
    flex:1 1 240px;display:flex;align-items:center;gap:14px;
    padding:16px 18px;border-radius:var(--radius);
    background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
  }
  .champ .card .ic{font-size:30px;line-height:1}
  .champ .card.gold{border-color:#5a4a1e;background:linear-gradient(135deg,#2a2413,#161b28)}
  .champ .card.bronze{border-color:#4a3320}
  .champ .card .role{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .champ .card .name{font-size:19px;font-weight:700;margin-top:2px}

  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
  nav.tabs button{
    background:none;border:0;color:var(--muted);font:inherit;font-weight:600;
    padding:11px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
    border-radius:8px 8px 0 0;
  }
  nav.tabs button:hover{color:var(--txt);background:var(--panel)}
  nav.tabs button.active{color:var(--txt);border-bottom-color:var(--accent)}

  section.tab{display:none}
  section.tab.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden}
  .panel + .panel{margin-top:18px}
  .panel h2{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line-soft);background:var(--bg2)}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:11px 12px;text-align:center;white-space:nowrap}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;
     background:var(--bg2);position:sticky;top:0}
  td:first-child,th:first-child{padding-left:18px}
  td:last-child,th:last-child{padding-right:18px}
  tbody tr{border-top:1px solid var(--line-soft)}
  tbody tr:hover{background:var(--panel2)}
  .t-left{text-align:left}
  .scroll-x{overflow-x:auto}

  .team{display:flex;align-items:center;gap:9px;text-align:left}
  .tag{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:38px;height:22px;padding:0 6px;border-radius:6px;
    background:var(--panel2);border:1px solid var(--line);
    font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent-soft);
  }
  .team .nm{font-weight:600}
  .pos{font-weight:800;color:var(--muted);width:26px}

  tr.q-final td:first-child{box-shadow:inset 3px 0 0 var(--win)}
  tr.q-third td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
  .qual{font-size:11px;color:var(--muted)}
  .qual.final{color:var(--win)}
  .qual.third{color:var(--blue)}
  .pts{font-weight:800;font-size:16px}

  /* matches */
  .round-h{padding:14px 18px 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
  .mrow .side{display:flex;align-items:center;gap:8px;flex:1;min-width:120px}
  .mrow .side.away{flex-direction:row-reverse;text-align:right}
  .mrow .sc{
    display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;
    background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 12px;min-width:78px;justify-content:center;
  }
  .mrow .sc .w{color:var(--win)} .mrow .sc .l{color:var(--loss)} .mrow .sc .d{color:var(--draw)}
  .mrow .sc.tbd{color:var(--dim);font-weight:600;font-size:14px}
  .mrow .meta{display:flex;gap:8px;align-items:center;flex-basis:100%;justify-content:center;margin-top:2px}
  .chip{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .chip-auto{color:var(--win);border-color:#2c5a3c}
  .chip-live{color:#ff5a5a;border-color:#5a2626;font-weight:700}
  .livebanner{display:flex;flex-wrap:wrap;gap:8px 18px;margin:-8px 0 20px;padding:11px 15px;
    border-radius:11px;border:1px solid #5a2626;background:rgba(229,72,77,.08);
    font-size:13px;color:#ffb3b3}
  .livebanner b{color:#fff}
  .live-panel{border-color:#5a2626}
  .live-panel h2{background:linear-gradient(90deg,rgba(229,72,77,.15),transparent);color:#ff7a7a}
  .mrow.live{background:linear-gradient(90deg,rgba(229,72,77,.06),transparent)}
  .mrow.live .nm{color:var(--txt)}
  .sc.live{border-color:#5a2626}
  .sc.live span{color:#ff7a7a}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--win)}
  .live i{width:8px;height:8px;border-radius:99px;background:var(--win);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media(min-width:640px){.mrow .meta{flex-basis:auto;margin-top:0;margin-left:auto}}

  /* playoff — сетка */
  .bracket{padding:22px 18px}
  .series{margin-bottom:26px}
  .series:last-child{margin-bottom:0}
  .series-head{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--gold);font-weight:800;margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
  .series-head em{font-style:normal;font-size:11px;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .series-body{display:grid;grid-template-columns:230px 46px minmax(190px,300px);
    align-items:center;justify-content:start}
  .pair{display:flex;flex-direction:column;gap:16px}
  .slot{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg2);min-height:44px}
  .slot .seed{font-size:11px;color:var(--dim);width:16px;flex:none;text-align:center}
  .slot .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .sc{margin-left:auto;font-weight:800;font-size:17px;color:var(--muted)}
  .slot.win{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,203,71,.35)}
  .slot.win .nm{color:var(--gold)}
  .slot.win .sc{color:var(--gold)}
  .slot.tbd .nm{color:var(--dim);font-weight:600}
  .lnk{width:100%;height:100%;min-height:104px;display:block;color:var(--line)}
  .result{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:11px;
    border:1px solid var(--line);background:linear-gradient(135deg,var(--panel2),var(--bg2))}
  .result .ic{font-size:30px;line-height:1;flex:none}
  .result small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .result b{font-size:18px}
  .result.champ{border-color:#5a4a1e;background:linear-gradient(135deg,#2a2413,var(--bg2))}
  .result.champ b{color:var(--gold)}
  .result.pending b{color:var(--dim);font-weight:600}
  .series-foot{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}

  @media(max-width:560px){
    .series-body{grid-template-columns:1fr;gap:0}
    .lnk{min-height:26px;height:26px;width:46px;margin:0 auto}
    .result{margin-top:0}
  }

  /* MVP */
  .mvp{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:16px;
    border-radius:14px;border:1px solid #5a4a1e;
    background:linear-gradient(120deg,#2c2513,var(--panel) 65%)}
  .mvp .crown{font-size:34px;line-height:1;flex:none}
  .mvp .mv-role{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);font-weight:800}
  .mvp .mv-name{font-size:21px;font-weight:800;margin:2px 0 1px}
  .mvp .mv-team{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
  .mvp .mv-stats{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.7;flex:none}
  .mvp .mv-stats b{color:var(--txt)}
  @media(max-width:560px){
    .mvp{flex-wrap:wrap;gap:10px;padding:14px 15px}
    .mvp .mv-stats{margin-left:0;text-align:left;width:100%;
      border-top:1px solid var(--line-soft);padding-top:9px}
  }

  /* leaders */
  .leaders{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:18px}
  @media(min-width:720px){.leaders{grid-template-columns:repeat(5,1fr)}}
  .lead{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px}
  .lead .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .lead .v{font-size:15px;font-weight:800;margin-top:6px;display:flex;align-items:baseline;gap:6px}
  .lead .v small{font-weight:600;color:var(--accent-soft);font-size:12px}
  .lead .t{font-size:11.5px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:5px}
  .lead .t .tag{min-width:30px;height:18px;font-size:10px}

  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--txt)}
  th.sortable.arru::after{content:" ▲";color:var(--accent)}
  th.sortable.arrd::after{content:" ▼";color:var(--accent)}
  select.filter{
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font:inherit;margin:14px 0 0 18px
  }
  .rat{font-weight:800}
  .rat.hi{color:var(--win)} .rat.lo{color:var(--loss)}

  .empty{padding:40px 18px;text-align:center;color:var(--muted)}
  .upcoming{padding:6px 18px 16px}
  .upcoming .uh{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 8px}
  .upcoming .ur{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
  .upcoming .ur .tag{color:var(--muted)}
  .upcoming .ur .vs{color:var(--dim);margin:0 2px}
  footer.note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line-soft);
    color:var(--dim);font-size:12px;text-align:center}

  /* ---------- телефон ---------- */
  @media (max-width:560px){
    .wrap{padding:16px 11px 60px}
    header.top{gap:10px 14px}
    .brand{gap:11px;width:100%}
    .brand .logo{height:36px}
    .updated{margin-left:0;width:100%;text-align:left;font-size:12px}
    .updated .live{font-size:12px}

    .champ{gap:8px;margin-bottom:16px}
    .champ .card{flex-basis:100%;padding:12px 14px;gap:11px}
    .champ .card .ic{font-size:24px}
    .champ .card .name{font-size:16px}

    nav.tabs{gap:0;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
      scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{padding:10px 13px;font-size:13.5px;white-space:nowrap;flex:none}

    .panel h2{padding:12px 14px;font-size:14px}
    th,td{padding:9px 7px;font-size:13px}
    td:first-child,th:first-child{padding-left:12px}
    td:last-child,th:last-child{padding-right:12px}
    th{font-size:10.5px;letter-spacing:.3px}

    /* таблица: закрепляем команду, остальное скроллится */
    #tab-standings td:nth-child(2),#tab-standings th:nth-child(2){
      position:sticky;left:0;background:var(--panel);z-index:1}
    #tab-standings tbody tr:hover td:nth-child(2){background:var(--panel2)}
    .col-playoff,.col-hide-sm{display:none}
    .team .nm{font-weight:600;font-size:13px}
    .pts{font-size:15px}

    .mrow{padding:11px 13px;gap:8px}
    .mrow .side{min-width:0;gap:6px;font-size:13px}
    .mrow .side .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mrow .sc{font-size:15px;min-width:64px;padding:3px 9px}
    .round-h{padding:12px 14px 4px}

    .pair{gap:0}
    .slot{border-radius:0;margin-top:-1px}
    .slot:first-child{border-radius:9px 9px 0 0}
    .slot:last-child{border-radius:0 0 9px 9px}

    .leaders{gap:8px;margin-bottom:14px}
    .lead{padding:11px 12px}

    /* игроки: закрепляем ник */
    #tab-players td:nth-child(2),#tab-players th:nth-child(2){
      position:sticky;left:0;background:var(--panel);z-index:1}
    select.filter{margin-left:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" id="logo" src="ica_logo.png" alt="ICA — Intergas Central Asia">
      <div class="titles">
        <h1 id="title">Турнир по CS2</h1>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>
    <div class="updated" id="updated"></div>
  </header>

  <div class="champ" id="champ"></div>

  <nav class="tabs" id="tabs">
    <button data-tab="standings" class="active">Таблица</button>
    <button data-tab="playoff">Плей-офф</button>
    <button data-tab="matches">Матчи</button>
    <button data-tab="players">Игроки</button>
  </nav>

  <section class="tab active" id="tab-standings"></section>
  <section class="tab" id="tab-playoff"></section>
  <section class="tab" id="tab-matches"></section>
  <section class="tab" id="tab-players"></section>

  <footer class="note" id="foot"></footer>
</div>

<script src="dashboard-data.js"></script>
<script>
(function(){
  const $ = (s,r=document)=>r.querySelector(s);
  const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
  let D = window.TOURNAMENT_DATA;
  let plSortKey='rating', plSortDir=-1;

  function paint(){
    if(!D){
      document.querySelector('.wrap').innerHTML =
        '<h1>Нет данных</h1><p style="color:#8a97ad">Турнир ещё не запущен.</p>';
      return;
    }
    $('#champ').innerHTML='';
    document.querySelectorAll('.livebanner').forEach(x=>x.remove());
    ['standings','playoff','matches','players'].forEach(id=>{ const s=$('#tab-'+id); if(s) s.innerHTML=''; });

  const T = {};
  (D.teams||[]).forEach(t=>T[t.id]=t);
  const teamName = id => (T[id]&&T[id].name) || '—';
  const teamTag  = id => (T[id]&&T[id].tag)  || '??';
  const rosterOf = id => ((T[id]&&T[id].players)||[]).map(p=>p.nick).join(', ');

  function teamCell(id){
    const w = el('div','team');
    const tag = el('span','tag', id?teamTag(id):'—');
    const nm = el('span','nm', id?teamName(id):'не определена');
    if(id) w.title = rosterOf(id);
    w.append(tag,nm); return w;
  }

  // ---------- header ----------
  $('#title').textContent = D.title || 'Турнир';
  $('#subtitle').textContent = D.subtitle || '';
  if(D.generatedAt){
    const dt = new Date(D.generatedAt*1000);
    const stamp = dt.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    $('#updated').innerHTML = (D.autoTrack
      ? '<span class="live"><i></i>онлайн-отслеживание</span><br>' : '') +
      '<span>обновлено ' + stamp + '</span>';
  }
  $('#foot').textContent = D.subtitle || 'Турнир ICA · CS2';

  // ---------- champion strip ----------
  const champ = $('#champ');
  if(D.championId){
    const c = el('div','card gold');
    c.innerHTML = `<div class="ic">🏆</div><div><div class="role">Чемпион</div>
      <div class="name">${teamName(D.championId)}</div></div>`;
    champ.append(c);
  }
  if(D.bronzeId){
    const c = el('div','card bronze');
    c.innerHTML = `<div class="ic">🥉</div><div><div class="role">3-е место</div>
      <div class="name">${teamName(D.bronzeId)}</div></div>`;
    champ.append(c);
  }

  // ---------- live banner ----------
  if((D.live||[]).length){
    const lb = el('div','livebanner');
    lb.innerHTML = D.live.map(m=>{
      const hn = m.homeId?teamName(m.homeId):'Команда 1';
      const an = m.awayId?teamName(m.awayId):'Команда 2';
      const s = m.score||[0,0];
      return `<span>🔴 <b>${hn} ${s[0]}:${s[1]} ${an}</b> · ${m.name}</span>`;
    }).join('');
    lb.style.cursor='pointer';
    lb.onclick = ()=>{ const b=$('#tabs [data-tab="matches"]'); if(b) b.click(); };
    champ.after(lb);
  }

  // ---------- standings ----------
  (function(){
    const host = $('#tab-standings');
    const s = D.standings||[];
    if(!s.length){ host.innerHTML='<div class="panel"><div class="empty">Матчи ещё не сыграны</div></div>'; return; }
    const p = el('div','panel');
    p.append(el('h2',null,'Турнирная таблица · круговой этап'));
    const sx = el('div','scroll-x');
    const tbl = el('table');
    tbl.innerHTML = `<thead><tr>
      <th>#</th><th class="t-left">Команда</th>
      <th>И</th><th>В</th><th class="col-hide-sm">Н</th><th>П</th>
      <th class="col-hide-sm">Раунды</th><th>Разн.</th><th>Очки</th><th class="t-left col-playoff">Плей-офф</th>
    </tr></thead>`;
    const tb = el('tbody');
    s.forEach(r=>{
      const tr = el('tr');
      let qual='', qtxt='';
      if(r.pos<=2){ qual='q-final'; qtxt='<span class="qual final">→ Финал</span>'; }
      else if(r.pos<=4){ qual='q-third'; qtxt='<span class="qual third">→ За 3-е место</span>'; }
      tr.className = qual;
      tr.innerHTML =
        `<td class="pos">${r.pos}</td>`+
        `<td class="t-left"></td>`+
        `<td>${r.gp}</td><td>${r.w}</td><td class="col-hide-sm">${r.d}</td><td>${r.l}</td>`+
        `<td class="col-hide-sm">${r.rw}:${r.rl}</td><td>${r.diff>0?'+':''}${r.diff}</td>`+
        `<td class="pts">${r.pts}</td>`+
        `<td class="t-left col-playoff">${qtxt}</td>`;
      tr.children[1].append(teamCell(r.teamId));
      tb.append(tr);
    });
    tbl.append(tb); sx.append(tbl); p.append(sx); host.append(p);

    const leg = el('div','panel');
    leg.innerHTML = '<div style="padding:12px 18px;color:var(--muted);font-size:12.5px">'+
      'Тай-брейки: очки → личные встречи → разница раундов → выигранные раунды → победы.</div>';
    host.append(leg);
  })();

  // ---------- playoff (сетка) ----------
  (function(){
    const host = $('#tab-playoff');
    const po = D.playoff||[];
    if(!po.length){ host.innerHTML='<div class="panel"><div class="empty">Плей-офф не настроен</div></div>'; return; }
    const p = el('div','panel');
    p.append(el('h2',null,'Плей-офф'));
    const bk = el('div','bracket');

    const seedName = n => `${n}-е место группы`;
    // порядок: финал сверху, затем матч за 3-е
    const ordered = po.slice().sort((a,b)=> (a.id==='final'?0:1) - (b.id==='final'?0:1));
    ordered.forEach(m=>{
      const bo = m.bestOf||1;
      const isFinal = m.id==='final';
      const slot = (idx,id,seed)=>{
        const sc = m.score ? m.score[idx] : null;
        const win = m.winnerId && id && m.winnerId===id;
        const tbd = !id;
        return `<div class="slot ${win?'win':''} ${tbd?'tbd':''}">
          <span class="seed">${seed}</span>
          ${id?`<span class="tag">${teamTag(id)}</span>`:''}
          <span class="nm">${id?teamName(id):seedName(seed)}</span>
          <span class="sc">${sc==null?'':sc}</span>
        </div>`;
      };
      const resDone = !!m.winnerId;
      const resHtml = resDone
        ? `<div class="result ${isFinal?'champ':''}">
             <span class="ic">${isFinal?'🏆':'🥉'}</span>
             <div><small>${isFinal?'Чемпион':'3-е место'}</small><b>${teamName(m.winnerId)}</b></div>
           </div>`
        : `<div class="result pending">
             <span class="ic" style="opacity:.4">${isFinal?'🏆':'🥉'}</span>
             <div><small>${isFinal?'Чемпион':'3-е место'}</small><b>—</b></div>
           </div>`;
      const s = el('div','series');
      s.innerHTML =
        `<div class="series-head">${m.name}<em>${bo>1?'серия до 2 побед':'один матч'}</em></div>`+
        `<div class="series-body">`+
          `<div class="pair">${slot(0,m.homeId,m.homeSeed)}${slot(1,m.awayId,m.awaySeed)}</div>`+
          `<svg class="lnk" viewBox="0 0 46 104" preserveAspectRatio="none">`+
            `<path d="M0,22 H24 M0,82 H24 M24,22 V82 M24,52 H46" stroke="currentColor" stroke-width="1.5" fill="none"/>`+
          `</svg>`+
          resHtml+
        `</div>`+
        (m.score||m.url ? `<div class="series-foot">`+
          (m.score? `<span>${resDone?'Завершено':'Идёт серия'} · по картам ${m.score[0]}:${m.score[1]}</span>`:'')+
          (m.url? `<a href="${m.url}" target="_blank" rel="noopener">статистика ↗</a>`:'')+
        `</div>` : '');
      bk.append(s);
    });
    p.append(bk); host.append(p);

    if(!D.rrDone){
      const n = el('div','panel');
      n.innerHTML = '<div style="padding:12px 18px;color:var(--muted);font-size:12.5px">'+
        'Пары определятся после кругового этапа: финал — 1 vs 2 место, матч за 3-е — 3 vs 4 место.</div>';
      host.append(n);
    }
  })();

  // ---------- matches (появляются по мере игры) ----------
  (function(){
    const host = $('#tab-matches');
    const rr = D.roundRobin||[];
    const played = rr.filter(m=>m.played);
    const upcoming = rr.filter(m=>!m.played);
    const live = D.live||[];

    if(live.length){
      const lp = el('div','panel live-panel');
      lp.append(el('h2',null,'🔴 Идёт сейчас'));
      live.forEach(m=>{
        const a=m.score?m.score[0]:0, b=m.score?m.score[1]:0;
        const hn = m.homeId?teamName(m.homeId):'Команда 1';
        const an = m.awayId?teamName(m.awayId):'Команда 2';
        const ht = m.homeId?teamTag(m.homeId):'—';
        const at = m.awayId?teamTag(m.awayId):'—';
        const row = el('div','mrow live');
        row.innerHTML =
          `<div class="side home"><span class="tag">${ht}</span><span class="nm">${hn}</span></div>`+
          `<div class="sc live"><span>${a}</span>:<span>${b}</span></div>`+
          `<div class="side away"><span class="tag">${at}</span><span class="nm">${an}</span></div>`+
          `<div class="meta">`+
            `<span class="chip chip-live">live · ${m.name}</span>`+
            (m.map?`<span class="chip">${m.map}</span>`:'')+
            (m.url?`<a class="chip" href="${m.url}" target="_blank" rel="noopener">смотреть ↗</a>`:'')+
          `</div>`;
        lp.append(row);
      });
      host.append(lp);
    }

    const p = el('div','panel');
    p.append(el('h2',null,'Сыгранные матчи'));
    if(!played.length){
      p.append(el('div','empty','Ещё не сыграно ни одного матча'));
    } else {
      // новые сверху: по туру убыв., внутри — как в расписании
      played.slice().sort((a,b)=>b.round-a.round).forEach(m=>{
        const a=m.score[0], b=m.score[1];
        const clsA=a>b?'w':a<b?'l':'d', clsB=b>a?'w':b<a?'l':'d';
        const row = el('div','mrow');
        row.innerHTML =
          `<div class="side home"><span class="tag">${teamTag(m.home)}</span><span class="nm">${teamName(m.home)}</span></div>`+
          `<div class="sc"><span class="${clsA}">${a}</span>:<span class="${clsB}">${b}</span></div>`+
          `<div class="side away"><span class="tag">${teamTag(m.away)}</span><span class="nm">${teamName(m.away)}</span></div>`+
          `<div class="meta">`+
            `<span class="chip">тур ${m.round}</span>`+
            (m.auto?`<span class="chip chip-auto">авто</span>`:'')+
            (m.date?`<span class="chip">${m.date}</span>`:'')+
            (m.series?`<span class="chip">по картам ${a}:${b}</span>`:'')+
            (m.maps&&m.maps[0]&&m.maps[0].map?`<span class="chip">${m.maps[0].map}</span>`:'')+
            (m.url?`<a class="chip" href="${m.url}" target="_blank" rel="noopener">статистика ↗</a>`:'')+
          `</div>`;
        p.append(row);
      });
    }
    host.append(p);

    if(upcoming.length){
      const u = el('div','panel');
      u.append(el('h2',null,`Ещё не сыграно · ${upcoming.length}`));
      const box = el('div','upcoming');
      const rounds = [...new Set(upcoming.map(m=>m.round))].sort((a,b)=>a-b);
      rounds.forEach(rd=>{
        box.append(el('div','uh','Тур '+rd));
        upcoming.filter(m=>m.round===rd).forEach(m=>{
          const r = el('div','ur');
          r.innerHTML = `<span class="tag">${teamTag(m.home)}</span><span>${teamName(m.home)}</span>`+
            `<span class="vs">—</span>`+
            `<span class="tag">${teamTag(m.away)}</span><span>${teamName(m.away)}</span>`;
          box.append(r);
        });
      });
      u.append(box); host.append(u);
    }
  })();

  // ---------- players ----------
  (function(){
    const host = $('#tab-players');
    const all = (D.players||[]).filter(p=>p.maps>0);
    if(!all.length){ host.innerHTML='<div class="panel"><div class="empty">Статистика появится после первых матчей</div></div>'; return; }

    // MVP — лучший по рейтингу (среди сыгравших не меньше медианного числа карт)
    const maxMaps = Math.max(...all.map(p=>p.maps));
    const pool = all.filter(p=>p.maps>=Math.max(1,Math.ceil(maxMaps/2)));
    const mvp = (pool.length?pool:all).slice().sort((a,b)=>b.rating-a.rating)[0];
    if(mvp){
      const done = !!D.championId;
      const h = el('div','mvp');
      h.innerHTML =
        `<span class="crown">${done?'👑':'⭐'}</span>`+
        `<div><div class="mv-role">${done?'MVP турнира':'Лучший игрок'}</div>`+
        `<div class="mv-name">${mvp.nick}</div>`+
        `<div class="mv-team"><span class="tag">${mvp.teamTag}</span> команда «${mvp.teamName}»</div></div>`+
        `<div class="mv-stats">Рейтинг <b>${mvp.rating}</b> · K/D <b>${mvp.kd}</b><br>`+
        `ADR <b>${mvp.adr}</b> · HS <b>${mvp.hs}%</b> · <b>${mvp.maps}</b> карт(ы)</div>`;
      host.append(h);
    }

    // leader cards
    const best = (key,fmt)=> all.slice().sort((a,b)=>b[key]-a[key])[0] &&
      (p=>({p, val: fmt? fmt(p[key]) : p[key]}))(all.slice().sort((a,b)=>b[key]-a[key])[0]);
    const cards = [
      ['Больше всего убийств','k', best('k')],
      ['Лучший ADR','adr', best('adr')],
      ['Входы (первый фраг)','entry', best('entry')],
      ['Клатчи','clutches', best('clutches')],
      ['Мультикиллы','multikills', best('multikills')],
    ];
    const lg = el('div','leaders');
    cards.forEach(([label,key,b])=>{
      if(!b) return;
      const c = el('div','lead');
      c.innerHTML = `<div class="k">${label}</div>
        <div class="v">${b.val} <small>${b.p.nick}</small></div>
        <div class="t"><span class="tag">${b.p.teamTag}</span> ${b.p.teamName}</div>`;
      lg.append(c);
    });
    host.append(lg);

    const p = el('div','panel');
    const head = el('h2',null,'Статистика игроков');
    p.append(head);

    const teams = [...new Set(all.map(x=>x.teamId))];
    const sel = el('select','filter');
    sel.innerHTML = '<option value="">Все команды</option>' +
      teams.map(id=>`<option value="${id}">${teamName(id)}</option>`).join('');
    p.append(sel);

    const sx = el('div','scroll-x');
    const tbl = el('table');
    const cols = [
      ['#',null],['Игрок','nick'],['Команда','teamName'],['Карт','maps'],
      ['Рейтинг','rating'],['K','k'],['D','d'],['A','a'],['K/D','kd'],
      ['ADR','adr'],['HS%','hs'],['Вход','entry'],['Клатчи','clutches'],['Мультикиллы','multikills'],
    ];
    const thead = el('thead'); const htr = el('tr');
    cols.forEach(([label,key],i)=>{
      const th = el('th', key?'sortable':null, label);
      if(i===1) th.classList.add('t-left');
      if(key) th.dataset.key = key;
      htr.append(th);
    });
    thead.append(htr); tbl.append(thead);
    const tb = el('tbody'); tbl.append(tb);
    sx.append(tbl); p.append(sx); host.append(p);

    let sortKey=plSortKey, sortDir=plSortDir;
    function render(){
      const f = sel.value;
      const rows = all.filter(x=>!f||x.teamId===f).slice().sort((a,b)=>{
        const va=a[sortKey], vb=b[sortKey];
        if(typeof va==='string') return sortDir*va.localeCompare(vb,'ru');
        return sortDir*(va-vb);
      });
      tb.innerHTML='';
      rows.forEach((x,i)=>{
        const tr=el('tr');
        const ratCls = x.rating>=1050?'hi':x.rating&&x.rating<960?'lo':'';
        tr.innerHTML =
          `<td class="pos">${i+1}</td>`+
          `<td class="t-left"><b>${x.nick}</b></td>`+
          `<td><span class="tag">${x.teamTag}</span></td>`+
          `<td>${x.maps}</td>`+
          `<td class="rat ${ratCls}">${x.rating||'—'}</td>`+
          `<td>${x.k}</td><td>${x.d}</td><td>${x.a}</td>`+
          `<td>${x.kd}</td><td>${x.adr}</td><td>${x.hs}%</td>`+
          `<td>${x.entry}</td><td>${x.clutches}</td><td>${x.multikills}</td>`;
        tb.append(tr);
      });
      tbl.querySelectorAll('th.sortable').forEach(th=>{
        th.classList.toggle('arru', th.dataset.key===sortKey && sortDir===1);
        th.classList.toggle('arrd', th.dataset.key===sortKey && sortDir===-1);
      });
    }
    tbl.querySelectorAll('th.sortable').forEach(th=>{
      th.onclick=()=>{
        const k=th.dataset.key;
        if(k===sortKey) sortDir*=-1;
        else { sortKey=k; sortDir = (k==='nick'||k==='teamName')?1:-1; }
        plSortKey=sortKey; plSortDir=sortDir;
        render();
      };
    });
    sel.onchange = render;
    render();
  })();
  } // конец paint()

  paint();

  // ---------- tabs ----------
  const tabs = $('#tabs');
  tabs.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===b));
    document.querySelectorAll('section.tab').forEach(s=>{
      s.classList.toggle('active', s.id==='tab-'+b.dataset.tab);
    });
    try{ localStorage.setItem('fc_tab', b.dataset.tab); }catch(_){}
  });
  try{
    const saved = localStorage.getItem('fc_tab');
    if(saved){ const b=tabs.querySelector(`[data-tab="${saved}"]`); if(b) b.click(); }
  }catch(_){}

  // ---------- живое обновление: тянем свежие данные мимо кеша и перерисовываем на месте ----------
  async function refresh(){
    try{
      const r = await fetch('dashboard-data.js?t='+Date.now(), {cache:'no-store'});
      if(!r.ok) return;
      const txt = await r.text();
      const i = txt.indexOf('= ');
      if(i < 0) return;
      const fresh = JSON.parse(txt.slice(i+2).replace(/;\s*$/,''));
      if((fresh.generatedAt||0) !== ((D&&D.generatedAt)||0)){
        D = fresh;
        paint();   // активная вкладка сохраняется — paint чистит только содержимое секций
      }
    }catch(_){}
  }
  (function loop(){
    const wait = (D && D.live && D.live.length) ? 12000 : 25000;
    setTimeout(async ()=>{ await refresh(); loop(); }, wait);
  })();
  refresh();   // сразу подтянуть самое свежее, минуя кеш загрузки страницы
})();
</script>
</body>
</html>
